# path: .github/workflows/ci.yml
# Prompt 18 — CI/CD for OHS Shield Tracker (MVP1).
# analyze+test on every PR; build artifacts + deploy Supabase (migrations +
# Edge Functions) on tags. Secrets are GitHub Actions secrets — never committed.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # The version the app is actually built, tested and device-verified on. The
  # Master Prompt pins 3.24.5, but the Android config requires AGP 9.0.1's new
  # DSL, which older Flutter does not supply — a control build on 3.41.6 fails at
  # Gradle script compilation before touching app code. CI on 3.24.5 was
  # therefore testing a configuration this codebase cannot compile in, and had
  # never passed. 🔖 Deviation from the Master Prompt pin; see Ledger §19.
  FLUTTER_VERSION: "3.44.6"

jobs:
  analyze_test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/lcov.info }

  rls_tests:
    name: RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        # Pinned, not `latest`: an unpinned CLI makes this job fail for
        # reasons unrelated to the change under test, which is how run #2
        # died inside the action itself. Matches the version used locally.
        with: { version: "2.114.0" }
      - run: supabase start
      - run: supabase db reset          # applies migrations + seed
      - run: supabase test db            # runs supabase/tests/*.sql (pgTAP)

  build:
    name: Build (Android AAB)
    needs: [analyze_test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Prod config injected from an Actions secret written to a temp file.
      - run: echo '${{ secrets.PROD_ENV_JSON }}' > config/env/prod.json
      - run: flutter build appbundle --release --flavor prod --dart-define-from-file=config/env/prod.json
      - uses: actions/upload-artifact@v4
        with: { name: app-prod-aab, path: build/app/outputs/bundle/prodRelease/*.aab }

  deploy_supabase:
    name: Deploy Supabase (migrations + functions)
    needs: [analyze_test, rls_tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        # Pinned, not `latest`: an unpinned CLI makes this job fail for
        # reasons unrelated to the change under test, which is how run #2
        # died inside the action itself. Matches the version used locally.
        with: { version: "2.114.0" }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      - run: supabase db push        # forward-only migrations
      - run: supabase functions deploy user-admin workflow-transition inspection-item-fail notify-fanout
      # notify-sweep is invoked by pg_cron (migration 0017), not by the app, so it
      # has no user JWT and cannot use the verify_jwt=true convention. It deploys
      # separately with --no-verify-jwt and is gated on the SWEEP_SECRET header
      # instead; it fails closed (403) until that secret is set.
      - run: supabase functions deploy notify-sweep --no-verify-jwt
      # Function secrets are set out-of-band, per environment:
      #   supabase secrets set FIREBASE_SERVICE_ACCOUNT="$(cat service-account.json)"
      #   supabase secrets set SWEEP_SECRET=<value>
      # FCM HTTP v1 — the legacy FCM_SERVER_KEY was retired by Google in 2024.
      #
      # The sweep also needs its caller configured in Supabase Vault on the target
      # project (hosted Supabase forbids `alter database ... set`):
      #   select vault.create_secret('https://<ref>.supabase.co/functions/v1/notify-sweep', 'sweep_url');
      #   select vault.create_secret('<same value as SWEEP_SECRET>', 'sweep_secret');
