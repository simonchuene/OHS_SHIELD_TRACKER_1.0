<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9f1"/>
      <stop offset="100%" stop-color="#f5f4eb"/>
    </linearGradient>

    <!-- Primary CTA / Safety Shield Gradient (135 deg) -->
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d631b"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <!-- Ambient Shadow Filter (6% on_surface, 24px blur, 8px Y-offset) -->
    <filter id="ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b1c17" flood-opacity="0.06"/>
    </filter>

    <!-- Soft Depth Glow for Inner Shield -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d631b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base App Canvas (108px Squircle Radius) -->
  <rect width="512" height="512" rx="108" fill="url(#bg-gradient)"/>

  <!-- Tonal Surface Sheet 1: Low-Container Layer -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="#f5f4eb"/>

  <!-- Tonal Surface Sheet 2: Actionable Elevated Card (Warm Ivory #fffef9) -->
  <rect x="72" y="72" width="368" height="368" rx="56" fill="#fffef9" filter="url(#ambient-shadow)"/>

  <!-- Asymmetrical Accent Bar (Tertiary #923357) -->
  <rect x="72" y="128" width="12" height="256" rx="6" fill="#923357"/>

  <!-- Central Emblem: The Vigilant Architect Shield Gauge -->
  <g transform="translate(256, 256)">
    
    <!-- Safety Circular Track (High-Importance Tone) -->
    <circle r="110" fill="none" stroke="#e4e3da" stroke-width="20" stroke-linecap="round"/>

    <!-- Safety Gauge Arc (Primary Brand Gradient) -->
    <circle r="110" fill="none" stroke="url(#primary-gradient)" stroke-width="20" 
            stroke-dasharray="691" stroke-dashoffset="180" stroke-linecap="round" 
            transform="rotate(-90)"/>

    <!-- Central Monolithic Shield Block -->
    <path d="M-48 -56 
             C-48 -56, 0 -68, 48 -56 
             C48 0, 44 64, 0 96 
             C-44 64, -48 0, -48 -56 Z" 
          fill="url(#primary-gradient)" 
          filter="url(#soft-glow)"/>

    <!-- Shield Internal Structure (Vigilant Health Cross in #e4e3da) -->
    <rect x="-24" y="-8" width="48" height="16" rx="8" fill="#e4e3da"/>
    <rect x="-8" y="-24" width="16" height="48" rx="8" fill="#e4e3da"/>

  </g>

  <!-- High-Contrast Top-Right Check Badge -->
  <g filter="url(#ambient-shadow)">
    <!-- Outer Defining Ring -->
    <circle cx="368" cy="136" r="34" fill="#f5f4eb"/>
    <!-- High-Importance Inner Badge (#e4e3da) -->
    <circle cx="368" cy="136" r="30" fill="#e4e3da"/>
    
    <!-- Vibrant Primary Green Checkmark -->
    <path d="M354 136 L363 145 L382 125" 
          fill="none" 
          stroke="url(#primary-gradient)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
